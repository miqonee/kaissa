name: Checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kaissa_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: kaissa_ux_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kaissa_test:local-test-only@127.0.0.1:5432/kaissa_ux_test
      JWT_SECRET: kaissa-ci-test-secret-not-for-production-2026
      KAISSA_TEST_BASE_URL: http://127.0.0.1:4417
      PORT: '4417'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run generate -w server
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:replay -w client && npm run check:seo -w client && npm run check:prerender -w client
      - run: npm run migrate:deploy -w server
      - run: node --import tsx scripts/smoke-team-rating-repair.mjs
      - name: Integration tests
        run: |
          NODE_ENV=test node server/dist/index.js > /tmp/kaissa-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent "$KAISSA_TEST_BASE_URL/api/health" > /dev/null; then break; fi
            sleep 0.2
          done
          node --import tsx scripts/smoke-accounts-ratings.mjs
          node scripts/smoke-live-ux.mjs
          node scripts/smoke-game-regressions.mjs
          node --import tsx scripts/smoke-maintenance.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: server-log
          path: /tmp/kaissa-server.log
