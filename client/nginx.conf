map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

map $arg_lang $seo_suffix {
  default "";
  en ".en";
}
map $request_uri $route_robots {
  default "index, follow";
  ~^/(login|admin|lobby|game|replay)(/|[?]|$) "noindex, follow";
  /404.html "noindex, follow";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Предотвращаем формирование абсолютных редиректов со схемой http:// и внутренним портом
  absolute_redirect off;
  port_in_redirect off;

  # Внутренний DNS Docker с динамическим разрешением (Nginx не падает, если server прогревается)
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend "http://server:4000";

  # Сжатие статики (Gzip)
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    image/svg+xml
    font/woff2;

  # Честная страница 404 Not Found для поисковых систем (Яндекс, Google)
  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Robots-Tag "noindex, follow" always;
  }

  # Both languages have their own HTML and matching canonical/hreflang.
  location ~ ^/(rules/(duo|bughouse|crazyhouse)|about|leaderboard|history|login)$ {
    try_files $uri$seo_suffix.html =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Robots-Tag $route_robots always;
  }
  location = / {
    try_files /index$seo_suffix.html =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Robots-Tag $route_robots always;
  }

  # Динамический sitemap.xml из backend
  location = /sitemap.xml {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # robots.txt: статический файл из html или прокси в backend
  location = /robots.txt {
    try_files $uri @backend_robots;
  }

  location @backend_robots {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA & Prerendered SSG:
  # 1. 301-редирект с завершающего слэша на канонический URL без слэша (/about/ -> /about).
  #    Устраняет ошибку поисковиков «Страница с переадресацией».
  # 2. Проверяем точный файл ($uri), затем SSG-страницу ($uri.html).
  #    ВАЖНО: $uri/ убран, чтобы Nginx не делал автоматический 301-редирект с добавлением слэша к каталогам.
  # 3. Если путь не найден, проверяем валидные динамические маршруты приложения (@spa_fallback).
  #    Любой другой неизвестный адрес возвращает честный HTTP 404 Not Found (исправляет предупреждение Яндекса).
  location / {
    rewrite ^/(.+)/$ /$1 permanent;
    try_files $uri $uri.html @spa_fallback;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Robots-Tag $route_robots always;
  }

  location @spa_fallback {
    add_header X-Robots-Tag $route_robots always;
    # Разрешенные динамические SPA-маршруты приложения
    if ($uri ~ ^/(?:lobby/[^/]+|game/[^/]+|players/[^/]+|admin|rules|replay/[^/]+)$) {
      rewrite ^ /index.html break;
    }
    return 404;
  }

  location ~* \.html$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Robots-Tag $route_robots always;
  }

  # Хешированная статика Vite (JS, CSS) — вечный иммутабельный кеш 1 год
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Статика фигур — 30 дней, immutable
  location /pieces/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # Веб-манифест PWA
  location ~* \.webmanifest$ {
    default_type application/manifest+json;
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # Иконки, SVG-логотипы, фавиконки и изображения
  location ~* \.(?:svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # REST API
  location /api/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.IO
  location /socket.io/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }
}
