map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

map $arg_lang $seo_suffix {
  default "";
  en ".en";
}
map $request_uri $route_robots {
  default "index, follow";
  ~^/(login|admin|lobby|game|replay|history)(/|[?]|$) "noindex, follow";
  /404.html "noindex, follow";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Предотвращаем формирование абсолютных редиректов со схемой http:// и внутренним портом
  absolute_redirect off;
  port_in_redirect off;

  # HSTS: сайт доступен только по HTTPS (TLS завершает прокси Coolify/Traefik).
  # Без includeSubDomains — на поддоменах x3dev/coolify свои правила.
  # ВАЖНО: nginx не наследует add_header в location, где есть собственные add_header,
  # поэтому эта строка продублирована в таких location ниже.
  add_header Strict-Transport-Security "max-age=31536000" always;

  # Внутренний DNS Docker с динамическим разрешением (Nginx не падает, если server прогревается)
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend "http://server:4000";

  # Сжатие статики (Gzip)
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    application/manifest+json
    image/svg+xml
    image/x-icon
    font/woff2;

  # Честная страница 404 Not Found для поисковых систем (Яндекс, Google)
  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, follow" always;
  }

  # Redirect public file aliases before serving any prerendered document.
  if ($request_uri ~ "^/index\.html(?:[?]|$)") { return 301 /$is_args$args; }
  if ($request_uri ~ "^/(rules/(?:duo|bughouse|crazyhouse|multiplayer)|about|leaderboard|history|login)\.html(?:[?]|$)") { return 301 /$1$is_args$args; }
  if ($request_uri ~ "^/(rules/(?:duo|bughouse|crazyhouse|multiplayer)|about|leaderboard|history|login)\.en\.html(?:[?]|$)") { return 301 /$1?lang=en; }
  location = /index.en.html { return 301 /?lang=en; }
  location = /rules { return 301 /rules/duo$is_args$args; }

  # Both languages have their own HTML and matching canonical/hreflang.
  location ~ ^/(rules/(duo|bughouse|crazyhouse|multiplayer)|about|leaderboard|history|login)$ {
    try_files $uri$seo_suffix.html =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag $route_robots always;
  }
  location = / {
    try_files /index$seo_suffix.html =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag $route_robots always;
  }

  # Existing profiles get their own HTML metadata; missing players return HTTP 404.
  location ^~ /players/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Динамический sitemap.xml из backend
  location = /sitemap.xml {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # robots.txt: статический файл из html или прокси в backend
  location = /robots.txt {
    try_files $uri @backend_robots;
  }

  location @backend_robots {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA & Prerendered SSG:
  # 1. 301-редирект с завершающего слэша ТОЛЬКО для известных маршрутов (/about/ -> /about, /rules/duo/ -> /rules/duo).
  #    Несуществующие адреса со слэшем (/nonexistent-dir/) сразу возвращают HTTP 404 без редиректа (требование Яндекса).
  # 2. Проверяем точный файл ($uri), затем SSG-страницу ($uri.html).
  #    ВАЖНО: $uri/ убран, чтобы Nginx не делал автоматический 301-редирект с добавлением слэша к каталогам.
  # 3. Если путь не найден, проверяем валидные динамические маршруты приложения (@spa_fallback).
  #    Любой другой неизвестный адрес возвращает честный HTTP 404 Not Found.
  location / {
    if ($uri ~ ^/(rules(?:/(?:duo|bughouse|crazyhouse|multiplayer))?|about|leaderboard|history|login|admin|(?:lobby|game|replay)/[^/]+)/+$) {
      return 301 /$1$is_args$args;
    }
    try_files $uri $uri.html @spa_fallback;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag $route_robots always;
  }

  location @spa_fallback {
    add_header X-Robots-Tag $route_robots always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Разрешенные динамические SPA-маршруты приложения
    if ($uri ~ ^/(?:lobby/[^/]+|game/[^/]+|admin|replay/[^/]+)$) {
      rewrite ^ /index.html break;
    }
    return 404;
  }

  location ~* \.html$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag $route_robots always;
  }

  # Хешированная статика Vite (JS, CSS) — вечный иммутабельный кеш 1 год
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  # Статика фигур и досок — 30 дней, immutable
  location /pieces/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  location /board/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  # Веб-манифест PWA
  location ~* \.webmanifest$ {
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=2592000";
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
  }

  # Иконки, SVG-логотипы, фавиконки и изображения
  location ~* \.(?:svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
    add_header Cache-Control "public, max-age=2592000";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "all";
    try_files $uri =404;
  }

  # REST API
  location /api/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.IO
  location /socket.io/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }
}
