services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kaissa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaissa-secret-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-kaissa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://kaissa:kaissa-secret-change-me@db:5432/kaissa?schema=public}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      ABANDON_SECONDS: ${ABANDON_SECONDS:-20}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-admin,ivan1}
      CORS_ORIGIN: "*"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    ports:
      - "${KAISSA_PORT:-8080}:8289"
    depends_on:
      - server

volumes:
  pgdata:
