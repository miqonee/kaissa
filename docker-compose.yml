services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kaissa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaissa-secret-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-kaissa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      kaissa:
        aliases:
          - db

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://kaissa:kaissa-secret-change-me@db:5432/kaissa?schema=public}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      ABANDON_SECONDS: ${ABANDON_SECONDS:-20}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-admin,ivan1}
      CORS_ORIGIN: "*"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
    networks:
      kaissa:
        aliases:
          - server

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    expose:
      - 80
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5
    depends_on:
      server:
        condition: service_healthy
    networks:
      default:
      kaissa:
        aliases:
          - client

volumes:
  pgdata:

networks:
  default:
  kaissa:
